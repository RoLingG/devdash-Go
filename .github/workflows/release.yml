name: Release

on:
  push:
    tags: [ 'v*' ]           # 打 v1.0.0 这类 tag 时自动发版
  workflow_dispatch:         # 也支持在 Actions 页手动触发（用于试跑测试+构建，不发版）

jobs:
  # ---- 第 1 步: 测试 + 覆盖率门槛（不合格不发版）----
  # 与 ci.yml 相同：双平台跑 go vet + go test + 覆盖率 >= 60%
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false       # 两个平台独立运行，一个失败不阻塞另一个
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test with coverage
        run: go test ./... -coverprofile=coverage.out

      # 覆盖率门槛: 全部包聚合覆盖率必须 >= 60%
      - name: Check coverage threshold (>= 60%)
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          awk -v t="$total" 'BEGIN { if (t < 60) { print "Coverage " t "% < 60%, failing"; exit 1 } print "Total coverage: " t "%" }'

  # ---- 第 2 步: 构建 3 个平台产物 ----
  build:
    name: Build (${{ matrix.name }})
    needs: test              # 测试通过才构建，保证"合格代码才发版"
    runs-on: ubuntu-latest   # 单一 runner 全交叉编译，无需原生 Windows/macOS runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: devdash-windows-amd64.exe
          - goos: darwin
            goarch: arm64
            name: devdash-darwin-arm64
          - goos: darwin
            goarch: amd64
            name: devdash-darwin-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      # CGO_ENABLED=0: 纯 Go 构建，保证跨平台可交叉编译（本地已实测通过）
      - name: Build ${{ matrix.name }}
        shell: bash
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o ${{ matrix.name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  # ---- 第 3 步: 汇总 3 个产物并发布 ----
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 仅 tag push 时发布；手动 workflow_dispatch 只跑测试+构建，不建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write        # 创建/更新 Release 所需权限
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 用官方 action 创建 Release：tag 名 = 版本号，自动生成 release notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true
